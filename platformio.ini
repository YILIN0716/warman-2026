; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings inherited by all environments
[env_base]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
monitor_speed = 115200
lib_deps      = arduino-libraries/Servo

; Main robot program
[env:megaatmega2560]
extends = env_base
build_src_filter = +<../src/main.cpp>

; Hardware test: motor ramp
[env:test_motor]
extends = env_base
build_src_filter = +<../test/test_motor.cpp>

; Hardware test: ultrasonic + servo
[env:test_ultrasonic_servo]
extends = env_base
build_src_filter = +<../test/test_ultrasonic_servo.cpp>